<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bilgi İşlem Altyapı Dashboard</title>
    <style>
        :root { 
            --primary: #1e293b; 
            --accent: #3b82f6; 
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass: rgba(255, 255, 255, 0.9);
        }

        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg-gradient); 
            margin: 0; 
            padding: 20px; 
            min-height: 100vh;
            color: #1e293b;
        }

        .container { max-width: 1200px; margin: auto; }

        /* ÜST RAPOR KARTLARI */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--glass);
            padding: 15px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            text-align: center;
        }

        .stat-card h4 { margin: 0; font-size: 11px; color: #64748b; text-transform: uppercase; }
        .stat-card p { margin: 5px 0 0; font-size: 22px; font-weight: bold; color: var(--primary); }

        /* ANA PANEL */
        .main-panel {
            background: var(--glass);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 20px; border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 15px;
        }

        #searchBox { 
            width: 220px; padding: 10px 15px; border: 1px solid #cbd5e1; 
            border-radius: 8px; outline: none;
        }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; font-size: 11px; color: #64748b; text-transform: uppercase; border-bottom: 2px solid rgba(0,0,0,0.05); }
        td { padding: 12px; border-bottom: 1px solid rgba(0,0,0,0.03); font-size: 13px; }
        tr:hover { background: rgba(59, 130, 246, 0.05); cursor: pointer; }

        code { background: #fef2f2; color: #b91c1c; padding: 2px 5px; border-radius: 4px; font-weight: bold; font-size: 12px; }

        /* KİŞİ KARTI */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
        .modal-content { 
            background: white; margin: 10vh auto; width: 90%; max-width: 500px; 
            border-radius: 20px; overflow: hidden; animation: zoomIn 0.2s ease;
        }
        @keyframes zoomIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .card-top { background: var(--primary); color: white; padding: 25px; position: relative; }
        .card-body { padding: 25px; }
        .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f1f5f9; }
        .notes-area { background: #f8fafc; padding: 15px; border-radius: 12px; border-left: 4px solid var(--accent); margin-top: 15px; }
        
        .badge { padding: 3px 8px; border-radius: 5px; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        .bg-vdsl { background: #e0f2fe; color: #0369a1; }
        .bg-fiber { background: #f0fdf4; color: #15803d; }
        .bg-metro { background: #faf5ff; color: #7e22ce; }
        .bg-sbox { background: #fff7ed; color: #9a3412; }
    </style>
</head>
<body>

<div class="container">
    <div class="stats-grid">
        <div class="stat-card"><h4>Türknet</h4><p id="stat-tnet">0</p></div>
        <div class="stat-card"><h4>Türk Telekom</h4><p id="stat-tt">0</p></div>
        <div class="stat-card"><h4>Superbox</h4><p id="stat-sbox">0</p></div>
    </div>

    <div class="main-panel">
        <div class="header">
            <div>
                <h3 style="margin:0">ALTYAPI ENVANTERİ</h3>
                <small style="color:#64748b">Bağcılar Belediyesi | Bilgi İşlem</small>
            </div>
            <input type="text" id="searchBox" placeholder="Ara..." onkeyup="search()">
        </div>

        <div style="overflow-x:auto">
            <table>
                <thead>
                    <tr>
                        <th>BİRİM ADI</th>
                        <th>MAHALLE</th>
                        <th>DEVRE NO</th>
                        <th>OPERATÖR</th>
                    </tr>
                </thead>
                <tbody id="tBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="myModal" class="modal">
    <div class="modal-content">
        <div class="card-top">
            <span style="position:absolute; right:20px; top:20px; cursor:pointer; font-size:20px" onclick="closeModal()">&times;</span>
            <h3 id="m-birim" style="margin:0"></h3>
            <span id="m-op-label" style="font-size:12px; opacity:0.8"></span>
        </div>
        <div class="card-body">
            <div class="info-row"><span>Mahalle</span><b id="m-mahalle"></b></div>
            <div class="info-row"><span>Adres</span><span id="m-adres" style="font-size:13px; color:#475569; text-align:right"></span></div>
            <div class="info-row"><span>Devre No</span><code id="m-devre"></code></div>
            <div class="info-row"><span>Bağlantı Tipi</span><span id="m-tip" class="badge"></span></div>
            <div class="notes-area">
                <div style="font-size:10px; font-weight:bold; color:#64748b; margin-bottom:5px">İŞLEM NOTLARI</div>
                <div id="m-not" style="font-size:13px; line-height:1.5; color:#334155"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const liste = [
        { birim: "100.YIL MAHALLESİ HAVUZ", mahalle: "100.YIL", adres: "2162. Sokak No:3", devre: "yuzyilhavuzvdsl", tip: "VDSL", op: "Türknet", not: "Devre kapatıldı, taşınma süreci bekleniyor." },
        { birim: "KAZIM KARABEKİR BİLGİ EVİ", mahalle: "K.KARABEKİR", adres: "259. Sokak No:2", devre: "kk_bilgievi", tip: "VDSL", op: "Türk Telekom", not: "Paket değişikliği yapıldı. Sorunsuz çalışıyor." },
        { birim: "GÜNEŞLİ BAĞ KAFE", mahalle: "GÜNEŞLİ", adres: "Fevzi Çakmak No:12", devre: "bagkafe_fiber", tip: "FİBER", op: "Türknet", not: "Yeni tesis tamamlandı. Hız testi stabil." },
        { birim: "ŞEHİR KÜTÜPHANESİ", mahalle: "SANCAKTEPE", adres: "Şehir Cad. No:5", devre: "kutuphane_metro", tip: "METRO", op: "Türk Telekom", not: "Sistem odası mutfaktan yeni odaya taşındı." },
        { birim: "MAHALLE MUHTARLIĞI", mahalle: "YENİGÜN", adres: "Muhtar Sok. No:1", devre: "sbox_123", tip: "SBOX", op: "Superbox", not: "Yedek hat olarak tanımlandı." }
    ];

    function updateStats() {
        document.getElementById('stat-tnet').innerText = liste.filter(i => i.op === "Türknet").length;
        document.getElementById('stat-tt').innerText = liste.filter(i => i.op === "Türk Telekom").length;
        document.getElementById('stat-sbox').innerText = liste.filter(i => i.op === "Superbox").length;
    }

    let filtered = [...liste];

    function draw() {
        document.getElementById('tBody').innerHTML = filtered.map(i => `
            <tr onclick="openCard('${i.birim}')">
                <td><b>${i.birim}</b></td>
                <td>${i.mahalle}</td>
                <td><code>${i.devre}</code></td>
                <td>${i.op}</td>
            </tr>
        `).join('');
        updateStats();
    }

    function search() {
        const val = document.getElementById('searchBox').value.toLowerCase();
        filtered = liste.filter(i => i.birim.toLowerCase().includes(val) || i.op.toLowerCase().includes(val) || i.mahalle.toLowerCase().includes(val) || i.devre.toLowerCase().includes(val));
        draw();
    }

    function openCard(name) {
        const i = liste.find(x => x.birim === name);
        document.getElementById('m-birim').innerText = i.birim;
        document.getElementById('m-op-label').innerText = i.op + " Altyapısı";
        document.getElementById('m-mahalle').innerText = i.mahalle;
        document.getElementById('m-adres').innerText = i.adres;
        document.getElementById('m-devre').innerText = i.devre;
        document.getElementById('m-tip').innerText = i.tip;
        document.getElementById('m-tip').className = "badge bg-" + i.tip.toLowerCase();
        document.getElementById('m-not').innerText = i.not || "Not bulunmuyor.";
        document.getElementById('myModal').style.display = "block";
    }

    function closeModal() { document.getElementById('myModal').style.display = "none"; }
    window.onclick = (e) => { if(e.target == document.getElementById('myModal')) closeModal(); }
    window.onload = draw;
</script>

</body>
</html>
