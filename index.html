<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altyapı Envanter Listesi</title>
    <style>
        :root { --primary: #1e293b; --accent: #3b82f6; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        
        .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 25px; gap: 15px; flex-wrap: wrap; }
        .title-area h2 { margin: 0; font-size: 19px; color: var(--primary); letter-spacing: -0.5px; }
        .title-area p { margin: 4px 0 0; font-size: 12px; color: #64748b; font-weight: 600; text-transform: uppercase; }
        
        /* Arama Kutusu Sağa Yaslı ve Kısa */
        #searchBox { width: 220px; padding: 10px 15px; border: 2px solid #e2e8f0; border-radius: 8px; outline: none; transition: 0.3s; font-size: 13px; }
        #searchBox:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }

        .table-area { overflow-x: auto; border: 1px solid #e2e8f0; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; cursor: pointer; }
        th { background: #f8fafc; padding: 15px; font-size: 11px; color: #64748b; text-align: left; text-transform: uppercase; border-bottom: 2px solid #e2e8f0; }
        td { padding: 14px 15px; border-bottom: 1px solid #f1f5f9; font-size: 13px; color: #1e293b; }
        tr:hover { background: #f8fbff; }
        code { background: #f1f5f9; color: #b91c1c; padding: 3px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; border: 1px solid #e2e8f0; }

        .pagination { display: flex; justify-content: center; gap: 5px; margin-top: 20px; }
        .pagination button { border: 1px solid #e2e8f0; background: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--primary); }
        .pagination button.active { background: var(--accent); color: white; border-color: var(--accent); font-weight: bold; }

        /* MODAL KART */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(3px); }
        .modal-content { background: white; margin: 10vh auto; width: 90%; max-width: 400px; border-radius: 12px; overflow: hidden; animation: slideIn 0.25s ease-out; }
        @keyframes slideIn { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .card-top { background: var(--primary); color: white; padding: 20px; position: relative; }
        .card-top h3 { margin: 0; font-size: 15px; text-transform: uppercase; padding-right: 25px; }
        .close { position: absolute; right: 15px; top: 15px; cursor: pointer; font-size: 20px; opacity: 0.7; }
        .close:hover { opacity: 1; }

        .card-body { padding: 15px; }
        .info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f1f5f9; }
        .info-row:last-child { border-bottom: none; }
        .info-lbl { font-size: 11px; font-weight: bold; color: #94a3b8; text-transform: uppercase; }
        .info-val { font-size: 13px; color: var(--primary); font-weight: 500; text-align: right; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="title-area">
            <h2>ALTYAPI ENVANTER LİSTESİ</h2>
            <p>Bilgi İşlem Müdürlüğü</p>
        </div>
        <input type="text" id="searchBox" placeholder="Birim veya devre ara..." onkeyup="search()">
    </div>

    <div class="table-area">
        <table>
            <thead>
                <tr>
                    <th>BİRİM ADI</th>
                    <th>MAHALLE</th>
                    <th>ADRES</th>
                    <th>DEVRE NO</th>
                </tr>
            </thead>
            <tbody id="tBody"></tbody>
        </table>
    </div>
    <div class="pagination" id="pagin"></div>
</div>

<div id="myModal" class="modal">
    <div class="modal-content">
        <div class="card-top">
            <span class="close" onclick="closeModal()">&times;</span>
            <h3 id="m-birim"></h3>
        </div>
        <div class="card-body">
            <div class="info-row"><span class="info-lbl">Mahalle</span><span class="info-val" id="m-mahalle"></span></div>
            <div class="info-row"><span class="info-lbl">Açık Adres</span><span class="info-val" id="m-adres"></span></div>
            <div class="info-row"><span class="info-lbl">Devre Numarası</span><span class="info-val"><code id="m-devre"></code></span></div>
            <div class="info-row"><span class="info-lbl">Dış IP Adresi</span><span class="info-val" id="m-ip" style="color:#2563eb;"></span></div>
            <div class="info-row"><span class="info-lbl">Bağlantı Tipi</span><span class="info-val" id="m-tip"></span></div>
        </div>
    </div>
</div>

<script>
    // Test verileri
    const liste = [
        { birim: "100.YIL MAHALLESİ HAVUZ", mahalle: "100.YIL", adres: "2162. Sokak No:3", devre: "yuzyilhavuzvdsl", tip: "100/4 Mbps - VDSL", ip: "BEKLENİYOR" },
        { birim: "KAZIM KARABEKİR BİLGİ EVİ", mahalle: "K.KARABEKİR", adres: "259. Sokak No:2", devre: "kk_bilgievi", tip: "50 Mbps - VDSL", ip: "BEKLENİYOR" },
        { birim: "GÜNEŞLİ BAĞ KAFE", mahalle: "GÜNEŞLİ", adres: "Fevzi Çakmak No:12", devre: "bagkafe_fiber", tip: "1000 Mbps - FTTX", ip: "BEKLENİYOR" },
        { birim: "ŞEHİR KÜTÜPHANESİ", mahalle: "SANCAKTEPE", adres: "Şehir Cad. No:5", devre: "kutuphane_metro", tip: "METRO ETH", ip: "BEKLENİYOR" },
        { birim: "YENİGÜN BİLGİ EVİ", mahalle: "YENİGÜN", adres: "Bağcılar Cad. No:88", devre: "yenigun_fiber", tip: "FTTX", ip: "BEKLENİYOR" }
    ];

    let current = 1;
    let perPage = 5; 
    let filtered = [...liste];

    function draw() {
        const start = (current - 1) * perPage;
        const items = filtered.slice(start, start + perPage);
        
        document.getElementById('tBody').innerHTML = items.map(i => `
            <tr onclick="openCard('${i.birim}')">
                <td><b>${i.birim}</b></td>
                <td>${i.mahalle}</td>
                <td>${i.adres}</td>
                <td><code>${i.devre}</code></td>
            </tr>
        `).join('');
        
        const pageCount = Math.ceil(filtered.length / perPage);
        let pHTML = "";
        for(let i=1; i<=pageCount; i++) {
            pHTML += `<button class="${i===current?'active':''}" onclick="current=${i};draw();">${i}</button>`;
        }
        document.getElementById('pagin').innerHTML = pHTML;
    }

    function search() {
        const val = document.getElementById('searchBox').value.toLowerCase();
        filtered = liste.filter(i => i.birim.toLowerCase().includes(val) || i.devre.toLowerCase().includes(val) || i.mahalle.toLowerCase().includes(val));
        current = 1;
        draw();
    }

    function openCard(name) {
        const i = liste.find(x => x.birim === name);
        document.getElementById('m-birim').innerText = i.birim;
        document.getElementById('m-mahalle').innerText = i.mahalle;
        document.getElementById('m-adres').innerText = i.adres;
        document.getElementById('m-devre').innerText = i.devre;
        document.getElementById('m-ip').innerText = i.ip;
        document.getElementById('m-tip').innerText = i.tip;
        document.getElementById('myModal').style.display = "block";
    }

    function closeModal() { document.getElementById('myModal').style.display = "none"; }
    window.onclick = (e) => { if(e.target == document.getElementById('myModal')) closeModal(); }
    window.onload = draw;
</script>

</body>
</html>
